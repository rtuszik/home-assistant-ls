name: Sync with upstream vscode-home-assistant

on:
    schedule:
        - cron: "0 3 1 * *" # monthly, 1st at 03:00 UTC
    workflow_dispatch:
        inputs:
            force_sync:
                description: "Force sync even if no changes detected"
                required: false
                default: false
                type: boolean

jobs:
    sync:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Add upstream remote
              run: |
                  git remote add upstream https://github.com/keesschollaart81/vscode-home-assistant.git
                  git fetch upstream

            - name: Configure git
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

            - name: Check for upstream changes
              id: changes
              run: ./scripts/check-upstream-changes.sh

            - name: Sync changes
              if: steps.changes.outputs.has_changes == 'true' || github.event.inputs.force_sync == 'true'
              run: ./scripts/sync-upstream.sh

            - name: Setup Node.js
              if: steps.changes.outputs.has_changes == 'true' || github.event.inputs.force_sync == 'true'
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Setup Aube
              if: steps.changes.outputs.has_changes == 'true' || github.event.inputs.force_sync == 'true'
              uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

            # The PR is only created if the synced code actually builds and
            # passes the LSP smoke test. A red run here means the sync needs
            # manual attention - that is intentional.
            - name: Build and test
              if: steps.changes.outputs.has_changes == 'true' || github.event.inputs.force_sync == 'true'
              run: |
                  aube install
                  aube run build
                  aube test
                  ./bin/home-assistant-ls --help

            - name: Get upstream commit info
              if: steps.changes.outputs.has_changes == 'true' || github.event.inputs.force_sync == 'true'
              id: upstream_info
              run: |
                  UPSTREAM_COMMIT=$(git rev-parse upstream/dev)
                  UPSTREAM_COMMIT_MSG=$(git log --format=%s -n 1 upstream/dev)
                  echo "commit=$UPSTREAM_COMMIT" >> $GITHUB_OUTPUT
                  echo "commit_msg=$UPSTREAM_COMMIT_MSG" >> $GITHUB_OUTPUT

            - name: Create Pull Request
              if: steps.changes.outputs.has_changes == 'true' || github.event.inputs.force_sync == 'true'
              uses: peter-evans/create-pull-request@v7
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  title: "sync: update language-service from upstream"
                  commit-message: "sync: update language-service from upstream"
                  body: |
                      Automated verbatim sync of `src/language-service/` from upstream
                      [vscode-home-assistant](https://github.com/keesschollaart81/vscode-home-assistant).

                      **Upstream commit:** [`${{ steps.upstream_info.outputs.commit }}`](https://github.com/keesschollaart81/vscode-home-assistant/commit/${{ steps.upstream_info.outputs.commit }})
                      **Commit message:** ${{ steps.upstream_info.outputs.commit_msg }}

                      The build and LSP smoke test passed in the sync workflow.
                      Check the upstream diff for API changes to `src/server.ts` /
                      `src/fileAccessor.ts` (e.g. changes under upstream's `src/server/`),
                      then merge.
                  branch: sync/upstream
                  delete-branch: true

            - name: No changes
              if: steps.changes.outputs.has_changes != 'true' && github.event.inputs.force_sync != 'true'
              run: echo "✅ No upstream changes in src/language-service"
